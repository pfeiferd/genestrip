name: Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # The default build skips the tests (surefire skipTests=true in pom.xml) and
      # already attaches the sources and javadoc jars of every module.
      - name: Build
        run: mvn -B -ntp package

      - name: Collect jars
        uses: actions/upload-artifact@v4
        with:
          name: genestrip-jars
          path: |
            */target/*.jar
          if-no-files-found: error
          retention-days: 14
